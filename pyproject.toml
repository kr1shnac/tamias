[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tamias"
version = "0.1.0a7"
description = "Local HTTP proxy that logs token usage and cost per request for OpenAI-compatible agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kr1shnac", email = "krishnacgowda10@gmail.com" },
]
keywords = [
    "llm",
    "proxy",
    "observability",
    "cost-tracking",
    "openai-compatible",
    "tokens",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
manifest = [
    "cryptography>=42",
]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.6,<1",
    "cryptography>=42",
]

[project.scripts]
tamias = "tamias.cli:main"

[project.urls]
Homepage = "https://github.com/kr1shnac/tamias"
Repository = "https://github.com/kr1shnac/tamias"
Issues = "https://github.com/kr1shnac/tamias/issues"
Changelog = "https://github.com/kr1shnac/tamias/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tamias"]

[tool.hatch.build.targets.sdist]
# Allowlist, not a denylist: only the package and the files a consumer needs
# ship in the source distribution. Anything not named here (tests/, docs/,
# demo/, scripts/, AGENTS.md, BLOCKED.md, TAMIAS-SSOT.md, the root prices.*.toml
# sheets) is excluded by default. Metadata files (pyproject.toml, LICENSE,
# README.md, CHANGELOG.md, PKG-INFO) are always added by the builder.
include = [
    "/src/tamias",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
