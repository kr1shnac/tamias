[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tamias"
version = "0.1.0a2"
description = "Local HTTP proxy that logs token usage and cost per request for OpenAI-compatible agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "kr1shnac", email = "krishnacgowda10@gmail.com" },
]
keywords = [
    "llm",
    "proxy",
    "observability",
    "cost-tracking",
    "openai-compatible",
    "tokens",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[project.scripts]
tamias = "tamias.cli:main"

[project.urls]
Homepage = "https://github.com/kr1shnac/tamias"
Repository = "https://github.com/kr1shnac/tamias"
Issues = "https://github.com/kr1shnac/tamias/issues"
Changelog = "https://github.com/kr1shnac/tamias/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/tamias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]