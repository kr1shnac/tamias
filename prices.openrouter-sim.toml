# SIMULATED price sheet for OpenRouter-shaped traffic.  THESE PRICES ARE INVENTED,
# NOT REAL.  The models below are real free OpenRouter models and really do cost
# $0.00, so nothing here should ever be read as what they cost.
#
# The point of this file is to rehearse a report against the *shape* of
# OpenRouter traffic while seeing what the arithmetic would say if the strong
# model were not free.  Every number below is made up:
#   nvidia/nemotron-3-ultra-550b-a55b:free = 3.0 / 15.0 / 0.30   invented
#   nvidia/nemotron-3.5-lightning:free    = 0.25 / 1.25 / 0.03  invented
# Neither figure comes from OpenRouter or NVIDIA.  `simulated = true` below is
# what stamps SIMULATED PRICES, NOT REAL SAVINGS onto every amount `tamias
# report` prints, so an invented number cannot be mistaken for a bill.
#
# For what these models actually cost, use `prices.openrouter.toml`, where every
# rate is a real 0.
#
# The tables are keyed by the real OpenRouter model ids, quoted because TOML bare
# keys allow only letters, digits, `_` and `-` while these ids carry `/` and `:`.
# Keying by the real ids is what lets a rehearsal price a real run: the ids a
# live session logs are then the ids this sheet has rates for, so a report over
# a real log finds prices instead of UNKNOWN.  `prices.simulated.toml` keeps the
# abstract `strong`/`cheap` pair, which is what the router logic itself reasons
# about in tests.

simulated = true
date = "2026-10-04"

# The expensive model an agent session starts on.
["nvidia/nemotron-3-ultra-550b-a55b:free"]
input = 3.0
output = 15.0
cached_input = 0.30
cache_write = 0.0

# The cheaper model mechanical tool work would be switched to.
["nvidia/nemotron-3.5-lightning:free"]
input = 0.25
output = 1.25
cached_input = 0.03
cache_write = 0.0
