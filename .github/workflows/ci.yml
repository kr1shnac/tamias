name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests scripts

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Audit wheel contents
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          assert all(name.startswith("tamias/") or ".dist-info/" in name for name in names)
          assert not any(name.startswith(("agent", "tui", "demo")) for name in names)
          PY
      - name: Audit sdist contents
        # The sdist is a public download; it must carry only the package and the
        # files a consumer needs, never the internals (tests, docs, demo,
        # scripts, the SSOT/BLOCKED/AGENTS notes, or the root price sheets).
        run: |
          python - <<'PY'
          import tarfile
          from pathlib import Path

          sdist = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(sdist) as archive:
              names = [member.name.split("/", 1)[-1] for member in archive.getmembers()]
          allowed_prefixes = (
              "src/tamias/",
              "LICENSE",
              "README.md",
              "CHANGELOG.md",
              "PKG-INFO",
              "pyproject.toml",
              ".gitignore",
          )
          offenders = [name for name in names if name and not name.startswith(allowed_prefixes)]
          assert not offenders, "sdist ships non-allowlisted entries: " + ", ".join(offenders)
          PY

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the project and the audit tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit cyclonedx-bom pip-licenses .
      - name: Known-vulnerability audit of installed dependencies
        # Audit the third-party dependencies, not the project itself: until it
        # is released the package is not on PyPI, and `--strict` treats an
        # unauditable distribution as a failure.
        run: |
          python -m pip freeze --exclude tamias > audit-requirements.txt
          pip-audit --strict -r audit-requirements.txt
      - name: Software bill of materials
        run: cyclonedx-py environment --of json -o sbom.json
      - name: License report and copyleft check
        run: |
          pip-licenses --format=csv --with-urls > licenses.csv
          python - <<'PY'
          import csv

          banned = ("agpl", "sspl", "gnu affero", "gpl-3", "gplv3", "server side public")
          with open("licenses.csv", newline="") as handle:
              rows = list(csv.DictReader(handle))
          offenders = [
              f"{row['Name']} {row['Version']}: {row['License']}"
              for row in rows
              if any(term in (row.get("License") or "").lower() for term in banned)
          ]
          if offenders:
              raise SystemExit("copyleft dependency: " + "; ".join(offenders))
          print(f"checked {len(rows)} distributions; no denylisted licenses")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-licenses
          path: |
            sbom.json
            licenses.csv

  smoke:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build the wheel
        run: python -m build --wheel
      - name: Install the wheel into a fresh venv and exercise the CLI
        run: |
          python -m venv /tmp/tamias-smoke
          /tmp/tamias-smoke/bin/python -m pip install --upgrade pip
          /tmp/tamias-smoke/bin/python -m pip install dist/*.whl
          expected="tamias $(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$(/tmp/tamias-smoke/bin/tamias --version)" = "$expected"
          printf 'date = "2026-10-10"\n[example]\ninput = 1\noutput = 1\n' > /tmp/prices.toml
          /tmp/tamias-smoke/bin/tamias doctor --prices /tmp/prices.toml --db /tmp/smoke.db --port 0

  claims-guard:
    # Fails the build if the project website (docs/index.html) carries a claim
    # the SSOT forbids, drops a statement it depends on, or quotes a version
    # that has drifted from pyproject.toml. Also checks the install source URL
    # the page points visitors at.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Website claims guard
        run: sh scripts/check-claims.sh --online
