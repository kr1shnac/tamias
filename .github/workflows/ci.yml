name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: ruff check src tests scripts

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Audit wheel contents
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheel = next(Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          assert all(name.startswith("tamias/") or ".dist-info/" in name for name in names)
          assert not any(name.startswith(("agent", "tui", "demo")) for name in names)
          PY

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Known-vulnerability audit of installed dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install .
          pip-audit --strict

  smoke:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build the wheel
        run: python -m build --wheel
      - name: Install the wheel into a fresh venv and exercise the CLI
        run: |
          python -m venv /tmp/tamias-smoke
          /tmp/tamias-smoke/bin/python -m pip install --upgrade pip
          /tmp/tamias-smoke/bin/python -m pip install dist/*.whl
          expected="tamias $(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$(/tmp/tamias-smoke/bin/tamias --version)" = "$expected"
          printf 'date = "2026-10-10"\n[example]\ninput = 1\noutput = 1\n' > /tmp/prices.toml
          /tmp/tamias-smoke/bin/tamias doctor --prices /tmp/prices.toml --db /tmp/smoke.db --port 0
