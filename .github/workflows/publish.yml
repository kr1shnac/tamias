name: Publish

# Publishes to PyPI via Trusted Publishing (OIDC) when a version tag is pushed.
# Setup (once, by a maintainer):
#   1. Add a PyPI "pending publisher" for this repo, workflow "publish.yml",
#      environment "pypi".
#   2. Push a tag like v0.1.0a4. No API token or secret is stored in the repo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Refuse a tag that disagrees with the packaged version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$tag" = "$packaged" || {
            echo "tag $GITHUB_REF_NAME does not match packaged version $packaged" >&2
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tamias
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
